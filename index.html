<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle Technique - Agenda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Contrôle Technique</h1>
        <nav>
            <ul>
                <li><a href="#">Agenda</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="agenda">
            <h2>Agenda des rendez-vous</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Heure</th>
                        <th>Client</th>
                        <th>Véhicule</th>
                        <th>Professionnel</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>14/10/2025</td>
                        <td>10:30</td>
                        <td>Jean Dupont</td>
                        <td>AB-123-CD</td>
                        <td>Marc Lefebvre</td>
                    </tr>
                    <tr>
                        <td>15/10/2025</td>
                        <td>09:00</td>
                        <td>Marie Curie</td>
                        <td>EF-456-GH</td>
                        <td>Sarah Martin</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="formulaire">
            <h2>Prendre un rendez-vous</h2>
            <form action="#" method="post">
                <label for="nom">Nom complet :</label>
                <input type="text" id="nom" name="nom" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="tel">Téléphone :</label>
                <input type="tel" id="tel" name="tel" required>

                <label for="immat">Immatriculation :</label>
                <input type="text" id="immat" name="immat" required>

                <label for="date">Date et heure :</label>
                <input type="datetime-local" id="date" name="date" required>

                <label for="pro">Professionnel :</label>
                <select id="pro" name="pro" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="Marc Lefebvre">Marc Lefebvre</option>
                    <option value="Sarah Martin">Sarah Martin</option>
                    <option value="Ahmed Benali">Ahmed Benali</option>
                </select>

                <button type="submit">Valider le rendez-vous</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2025 Contrôle Technique - Tous droits réservés</p>
    </footer>
</body>
</html>
